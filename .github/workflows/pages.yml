name: Deploy to GitHub Pages

# Deploys site/ to https://dwiis.dedusoft.com (environment: github-pages).
# site/ is generated by the Release workflow in the private dedusoft/dwiis
# repository — do not edit it by hand.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify checksums and version
        id: check
        working-directory: site
        run: |
          set -euo pipefail
          for f in index.html install.sh install.sh.sha256 VERSION releases/VERSION releases/dwiis-latest.tar.gz releases/dwiis-latest.tar.gz.sha256; do
            [[ -s "$f" ]] || { echo "::error file=site/$f::missing or empty"; exit 1; }
          done
          sha256sum -c install.sh.sha256
          (cd releases && sha256sum -c ./*.sha256)

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid VERSION '$version'"; exit 1; }
          [[ "$(tr -d '[:space:]' < releases/VERSION)" == "$version" ]] || { echo "::error::releases/VERSION differs from VERSION"; exit 1; }
          tarball_version="$(tar xzf releases/dwiis-latest.tar.gz -O dwiis/VERSION | tr -d '[:space:]')"
          [[ "$tarball_version" == "$version" ]] || { echo "::error::tarball is $tarball_version, VERSION is $version"; exit 1; }
          if grep -q '__DWIIS_' index.html; then echo "::error file=site/index.html::unreplaced placeholder"; exit 1; fi
          bash -n install.sh

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Site bundle for DWIIS $version is valid"

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke test
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check live endpoints
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          cb() { echo "cb=$(date +%s%N)"; }
          echo "Checking $base for version $VERSION"
          for i in $(seq 1 30); do
            live="$(curl -fsSL --max-time 15 "$base/VERSION?$(cb)" 2>/dev/null | tr -d '[:space:]' || true)"
            [[ "$live" == "$VERSION" ]] && break
            echo "attempt $i: got '${live:-unreachable}', retrying in 20s"
            sleep 20
          done
          [[ "$live" == "$VERSION" ]] || { echo "::error::$base/VERSION reports '${live:-unreachable}', expected $VERSION. If the custom domain is new, check DNS and the HTTPS certificate in Settings → Pages."; exit 1; }

          cd "$(mktemp -d)"
          curl -fsSL "$base/install.sh?$(cb)" -o install.sh
          curl -fsSL "$base/install.sh.sha256?$(cb)" -o install.sh.sha256
          sha256sum -c install.sh.sha256
          curl -fsSL "$base/?$(cb)" | grep -q "v$VERSION" || { echo "::error::landing page does not show v$VERSION"; exit 1; }

          {
            echo "### ✅ $base is serving DWIIS $VERSION"
            echo
            echo "| Endpoint | Status |"
            echo "|---|---|"
            echo "| \`/\` | OK |"
            echo "| \`/VERSION\` | $VERSION |"
            echo "| \`/install.sh\` (checksum) | OK |"
          } >> "$GITHUB_STEP_SUMMARY"
